# units.yaml - the pipeline roadmap.
#
# One entry per unit. Read by ops/orchestrator.py; the live copy with runtime
# state is ~/phpretro-ops/state/units.live.yaml and STATE.md.
#
#   status:    todo | building | pr_open | queued | merged | parked | design
#   depends_on: unit ids that must be `merged` before this unit is dispatched
#   paths:     repo-relative paths the builder may touch (max 8); two units
#              whose paths overlap never run at the same time
#   tests:     the focused commands the builder runs
#   acceptance: at most 5 bullets, all of which must hold
#   fixtures:  synthetic fixtures or evidence files the tests cite
#   size:      S | M | L (an L must be split by the planner before dispatch)
#
# F0-F17 were delivered before the pipeline existed and are recorded as merged.
# F18 is adopted from the delivered f18/profile-read-model branch. F19-F30 come
# from docs/roadmap/F18-F30-feature-approval.md. F31-F60 are design placeholders
# from docs/roadmap/F31-F45-candidate-design.md and F46-F60-candidate-design.md.
